
<!DOCTYPE html>



<html>



<head>



    <title>Scooter Finder App</title>



    <style>



        body {



            font-family: Arial, sans-serif;



            background-color: #f4f4f4;



            padding: 20px;



        }



        .container {



            max-width: 700px;



            margin: auto;



            background: white;



            padding: 20px;



            border-radius: 10px;



        }



        h1 {



            text-align: center;



            color: #333;



        }



        input {



            width: 70%;



            padding: 10px;



            font-size: 16px;



        }



        button {



            padding: 10px 15px;



            font-size: 16px;



            cursor: pointer;



        }



        .scooter-card {



            border: 1px solid #ddd;



            margin-top: 10px;



            padding: 10px;



            border-radius: 5px;



            background-color: #fafafa;



        }



        .available {



            color: green;



            font-weight: bold;



        }



        .unavailable {



            color: red;



            font-weight: bold;



        }



        #results {



            margin-top: 20px;



        }



    </style>



</head>



<body>



<div class="container">



    <h1>Scooter Finder App</h1>



    <p>



        Enter your downtown location to find nearby scooters.



    </p>



    <input



        type="text"



        id="locationInput"



        placeholder="Example: Downtown Ottawa">



    <button onclick="findScooters()">



        Find Scooters



    </button>



    <div id="results"></div>



</div>



<script>



    // Array containing scooter data



    const scooters = [



        {



            id: 1,



            name: "Lime Scooter",



            distance: 0.3,



            cost: 4.50,



            available: true



        },



        {



            id: 2,



            name: "Bird Scooter",



            distance: 0.8,



            cost: 5.25,



            available: true



        },



        {



            id: 3,



            name: "Spin Scooter",



            distance: 1.2,



            cost: 3.75,



            available: false



        },



        {



            id: 4,



            name: "Neuron Scooter",



            distance: 0.5,



            cost: 4.00,



            available: true



        }



    ];



    // Function to find scooters



    function findScooters() {



        let userLocation =



            document.getElementById("locationInput").value;



        let results =



            document.getElementById("results");



        results.innerHTML = "";



        // Input validation



        if (userLocation.trim() === "") {



            results.innerHTML =



                "<p>Please enter a location.</p>";



            return;



        }



        // Heading



        results.innerHTML =



            "<h2>Scooters Near " +



            userLocation +



            "</h2>";



        // Sort scooters by distance



        scooters.sort(function(a, b) {



            return a.distance - b.distance;



        });



        // Loop through scooters



        for (let i = 0; i < scooters.length; i++) {



            let scooter = scooters[i];



            let statusText = "";



            let statusClass = "";



            if (scooter.available) {



                statusText = "Available";



                statusClass = "available";



            } else {



                statusText = "Unavailable";



                statusClass = "unavailable";



            }



            results.innerHTML +=



            `<div class="scooter-card">



                <h3>${scooter.name}</h3>



                <p>



                    Distance:



                    ${scooter.distance} km



                </p>



                <p>



                    Cost:



                    $${scooter.cost}



                </p>



                <p class="${statusClass}">



                    ${statusText}



                </p>



            </div>`;



        }



    }



</script>



</body>



</html>
